<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EB"/>
      <stop offset="100%" stop-color="#EBE5D8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="32" fill="url(#bgWarm)"/>
  <rect x="2" y="2" width="796" height="516" rx="30" fill="none" stroke="#DDD6C6" stroke-width="2"/>

  <!-- Swiss Grid Lines -->
  <line x1="260" y1="40" x2="260" y2="480" stroke="#DDD6C6" stroke-width="1.5"/>
  <line x1="50" y1="200" x2="750" y2="200" stroke="#DDD6C6" stroke-width="1.5"/>

  <!-- Col 1 -->
  <g transform="translate(60, 80)">
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#78716C" letter-spacing="2">EDITION 04</text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#78716C" letter-spacing="2">SWISS PRINT</text>
    
    <text x="0" y="220" font-family="'Playfair Display', serif" font-size="72" font-weight="700" fill="#1C1917">72pt</text>
    <text x="0" y="260" font-family="'Inter', sans-serif" font-size="14" fill="#78716C">Display Serif</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(300, 80)">
    <text x="0" y="45" font-family="'Playfair Display', serif" font-size="44" font-weight="600" fill="#1C1917">Typography</text>
    <text x="0" y="95" font-family="'Playfair Display', serif" font-size="44" font-weight="600" fill="#1C1917">as an Art Form.</text>

    <g transform="translate(0, 160)">
      <text x="0" y="30" font-family="'Inter', sans-serif" font-size="16" fill="#57534E" line-height="1.6">Every pixel intentional.</text>
      <text x="0" y="56" font-family="'Inter', sans-serif" font-size="16" fill="#57534E">Calibrated spacing, micro-contrast,</text>
      <text x="0" y="82" font-family="'Inter', sans-serif" font-size="16" fill="#57534E">and authentic editorial hierarchy.</text>

      <rect x="0" y="125" width="160" height="40" rx="20" fill="#1C1917"/>
      <text x="32" y="150" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FAFAF9">Read Edition →</text>
    </g>
  </g>
</svg>
