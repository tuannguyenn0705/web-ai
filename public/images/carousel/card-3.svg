<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgAgent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="32" fill="url(#bgAgent)"/>
  <rect x="2" y="2" width="796" height="516" rx="30" fill="none" stroke="#27272A" stroke-width="2"/>

  <!-- Window Chrome Header -->
  <g transform="translate(40, 35)">
    <circle cx="10" cy="10" r="6" fill="#EF4444"/>
    <circle cx="30" cy="10" r="6" fill="#F59E0B"/>
    <circle cx="50" cy="10" r="6" fill="#10B981"/>
    <text x="80" y="15" font-family="'Courier New', monospace" font-size="13" fill="#71717A">terminal // ai-agent.pipeline.config</text>
  </g>

  <!-- Content -->
  <g transform="translate(60, 110)">
    <rect width="180" height="32" rx="16" fill="rgba(139, 92, 246, 0.15)" stroke="#8B5CF6" stroke-width="1"/>
    <text x="20" y="21" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#A78BFA">✦ AI Intelligence Hub</text>

    <text x="0" y="100" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Neural Synthesis</text>
    <text x="0" y="155" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="700" fill="url(#purpleGlow)">Zero Slop Interface</text>

