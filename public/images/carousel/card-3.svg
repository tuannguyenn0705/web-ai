      <text x="25" y="40" font-family="'Courier New', monospace" font-size="15" fill="#34D399">$ npx skills add taste-skill/ai-agent</text>
      <text x="25" y="75" font-family="'Courier New', monospace" font-size="15" fill="#9CA3AF">✓ Verified UI/UX Taste Matrix: 100% Passed</text>
      <text x="25" y="110" font-family="'Courier New', monospace" font-size="15" fill="#60A5FA">→ Deployed active models: GPT-5, Gemini 2.0, Claude 4</text>
