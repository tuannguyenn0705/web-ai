<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="32" fill="url(#bgGold)"/>
  <rect x="2" y="2" width="796" height="516" rx="30" fill="none" stroke="#27272A" stroke-width="2"/>

  <g transform="translate(60, 90)">
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="12" fill="#D97706" letter-spacing="3">TASTE // BRAND GUIDELINE SYSTEM</text>
    
    <text x="0" y="90" font-family="'Playfair Display', serif" font-size="52" font-weight="600" fill="url(#goldText)">Architectural</text>
    <text x="0" y="150" font-family="'Playfair Display', serif" font-size="52" font-weight="600" fill="#FFFFFF">Precision.</text>

    <text x="0" y="210" font-family="'Inter', sans-serif" font-size="16" fill="#A1A1AA">Every line crafted for luxury digital interfaces.</text>
    <text x="0" y="235" font-family="'Inter', sans-serif" font-size="16" fill="#A1A1AA">Anti-generic standards for next-generation products.</text>

    <!-- Geometry wireframe accents -->
    <g transform="translate(480, 40)" opacity="0.6">
      <circle cx="90" cy="90" r="80" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
      <rect x="20" y="20" width="140" height="140" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
      <line x1="20" y1="20" x2="160" y2="160" stroke="#F59E0B" stroke-width="1"/>
      <line x1="160" y1="20" x2="20" y2="160" stroke="#F59E0B" stroke-width="1"/>
    </g>
  </g>
</svg>
