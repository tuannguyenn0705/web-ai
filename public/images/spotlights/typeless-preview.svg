<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <linearGradient id="typelessRightCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFF2FE"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#FDE2D2"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="warmBlob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="cardBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Pure White Page Background -->
  <rect width="1024" height="600" fill="#FFFFFF"/>

  <!-- Top Navigation Bar (English Typeless.com) -->
  <g transform="translate(80, 26)">
    <!-- Typeless Logo Mark + Text -->
    <g transform="translate(0, 6)">
      <path d="M4 18C4 10.268 10.268 4 18 4C23.5 4 28.2 7.2 30.4 11.8C27.2 9.4 22.8 9.2 19.2 11.5C15.5 13.8 14.2 18.4 16 22.3L4 18Z" fill="#0F172A"/>
      <circle cx="21" cy="18" r="5" fill="#0F172A"/>
      <text x="36" y="21" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">Typeless</text>
    </g>

    <!-- Nav Links (English) -->
    <text x="345" y="26" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#334155">Manifesto</text>
    <text x="435" y="26" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#334155">Pricing</text>
    <text x="505" y="26" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#334155">About</text>

    <!-- Top Right Download Pill -->
    <g transform="translate(710, 2)">
      <rect width="164" height="36" rx="18" fill="#111827"/>
      <text x="82" y="22.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">Download for Windows</text>
    </g>
  </g>

  <!-- Center Hero Section (English) -->
  <g transform="translate(512, 175)" text-anchor="middle">
    <text y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="800" letter-spacing="-0.035em">
      <tspan fill="#0F172A">Speak, </tspan>
      <tspan fill="#8E8E93">don't type</tspan>
    </text>

    <text y="50" font-family="Inter, -apple-system, sans-serif" font-size="15.5" font-weight="400" fill="#94A3B8">
      <tspan fill="#94A3B8">Voice dictation that </tspan>
      <tspan fill="#334155" font-weight="500">turns messy thoughts into clear writing</tspan>
      <tspan fill="#94A3B8"> in any app. </tspan>
      <tspan fill="#0F172A" font-weight="600">4x faster than typing.</tspan>
    </text>

    <!-- Primary Black Pill CTA -->
    <g transform="translate(-92, 82)">
      <rect width="184" height="44" rx="22" fill="#111827" filter="url(#softShadow)"/>
      <text x="92" y="27" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF">Download for Windows</text>
    </g>
  </g>

  <!-- Bottom 2-Card Speed Comparison Showcase (45 wpm vs 220 wpm & Save 1 day/week) -->
  <!-- Left Card: QWERTY Keyboard (45 wpm) -->
  <g transform="translate(80, 345)">
    <rect width="275" height="235" rx="22" fill="#E5E7EB" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="10" y="10" width="255" height="108" rx="16" fill="#F8FAFC" filter="url(#softShadow)"/>
    <text x="245" y="38" text-anchor="end" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">QWERTY keyboard</text>
    <text x="212" y="92" text-anchor="end" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">45</text>
    <text x="245" y="92" text-anchor="end" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B">wpm</text>

    <!-- Subtle document preview box below -->
    <rect x="65" y="155" width="145" height="65" rx="12" fill="#FFFFFF" opacity="0.9"/>
    <rect x="82" y="172" width="75" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="82" y="185" width="110" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="82" y="198" width="55" height="6" rx="3" fill="#E2E8F0"/>
  </g>

  <!-- Right Card: Typeless Voice Keyboard (220 wpm | Save 1 day/week) -->
  <g transform="translate(372, 345)">
    <rect width="572" height="235" rx="22" fill="url(#typelessRightCardBg)" stroke="#BAE6FD" stroke-width="1.5"/>
    <circle cx="285" cy="165" r="95" fill="url(#warmBlob)" filter="url(#cardBlur)"/>

    <!-- Inner White Metric Bar -->
    <rect x="12" y="10" width="548" height="108" rx="16" fill="#FFFFFF" fill-opacity="0.92" filter="url(#softShadow)"/>

    <!-- Left Metric: Typeless voice keyboard 220 wpm -->
    <text x="30" y="38" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Typeless voice keyboard</text>
    <text x="30" y="92" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">220</text>
    <text x="115" y="92" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B">wpm</text>

    <!-- Right Metric: Save 1 day/week -->
    <text x="380" y="38" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Save</text>
    <text x="380" y="92" font-family="Inter, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">1 day</text>
    <text x="492" y="92" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B">/week</text>

    <!-- Subtle active voice waveform pill below -->
    <rect x="75" y="155" width="422" height="65" rx="14" fill="#FFFFFF" fill-opacity="0.94" filter="url(#softShadow)"/>
    <circle cx="105" cy="187" r="12" fill="#0F172A"/>
    <rect x="103.5" y="181" width="3" height="12" rx="1.5" fill="#FFFFFF"/>
    <rect x="130" y="176" width="210" height="7" rx="3.5" fill="#0F172A" opacity="0.8"/>
    <rect x="130" y="191" width="315" height="7" rx="3.5" fill="#64748B" opacity="0.45"/>
  </g>
</svg>
